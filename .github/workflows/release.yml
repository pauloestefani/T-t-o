name: Release Tátão

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar versão / se já existe release
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = node -p "require('./package.json').version"
          "ver=$ver" >> $env:GITHUB_OUTPUT
          $null = gh release view "v$ver" --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -eq 0) { "skip=true" >> $env:GITHUB_OUTPUT; Write-Host "Release v$ver ja existe - pulando." }
          else { "skip=false" >> $env:GITHUB_OUTPUT; Write-Host "Vai publicar v$ver." }
          exit 0

      - name: Instalar dependências
        if: steps.check.outputs.skip == 'false'
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Baixar o Wintun (driver da placa de rede virtual)
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Write-Host ("sha256 do zip: " + (Get-FileHash wintun.zip -Algorithm SHA256).Hash)
          Expand-Archive wintun.zip -DestinationPath wintun-x -Force
          $dll = Get-ChildItem -Recurse wintun-x -Filter wintun.dll | Where-Object { $_.FullName -match '\\amd64\\' } | Select-Object -First 1
          if (-not $dll) { throw "wintun.dll (amd64) nao encontrado no zip" }
          $sig = Get-AuthenticodeSignature $dll.FullName
          Write-Host ("assinatura: " + $sig.Status + " | " + $sig.SignerCertificate.Subject)
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "WireGuard") { throw "assinatura do wintun.dll invalida" }
          New-Item -ItemType Directory -Force vendor | Out-Null
          Copy-Item $dll.FullName vendor/wintun.dll
          $lic = Get-ChildItem -Recurse wintun-x -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName vendor/wintun-LICENSE.txt }

      - name: Compilar o capturador de áudio (tatao-audio.exe)
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = if (Test-Path $vswhere) { & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath } else { $null }
          if ($vs) {
            Write-Host "compilando com MSVC ($vs)"
            cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cl /nologo /O2 /EHsc /MT /W3 native\tatao-audio.cpp /Fe:vendor\tatao-audio.exe /link ole32.lib mmdevapi.lib"
            if ($LASTEXITCODE -ne 0) { throw "cl falhou" }
          } else {
            Write-Host "compilando com g++"
            g++ -O2 -static -s -o vendor/tatao-audio.exe native/tatao-audio.cpp -lole32 -lmmdevapi -luuid
            if ($LASTEXITCODE -ne 0) { throw "g++ falhou" }
          }
          Remove-Item -ErrorAction SilentlyContinue vendor\*.obj, *.obj
          Get-Item vendor/tatao-audio.exe | Format-List Name,Length
          # só pra ver se o programa abre (a máquina do GitHub não tem placa de som)
          $p = Start-Process -FilePath vendor/tatao-audio.exe -ArgumentList "list","0" -NoNewWindow -PassThru -Wait -RedirectStandardOutput list-out.txt -RedirectStandardError list-err.txt
          Write-Host ("list: código " + $p.ExitCode); Get-Content list-out.txt, list-err.txt -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath vendor/tatao-audio.exe -ArgumentList "capture","exclude","$PID","0" -NoNewWindow -PassThru -RedirectStandardOutput cap-out.bin -RedirectStandardError cap-err.txt
          if (-not $p.WaitForExit(4000)) { Stop-Process -Id $p.Id -Force; Write-Host "capture: rodando (encerrado pelo teste)" } else { Write-Host ("capture: código " + $p.ExitCode) }
          Get-Content cap-err.txt -ErrorAction SilentlyContinue
          if (Test-Path cap-out.bin) { Write-Host ("bytes capturados: " + (Get-Item cap-out.bin).Length) }
          exit 0

      - name: Chave do YouTube (opcional, do segredo YT_API_KEY)
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          if ($env:YT_API_KEY) {
            New-Item -ItemType Directory -Force vendor | Out-Null
            @{ ytKey = $env:YT_API_KEY } | ConvertTo-Json | Set-Content -Encoding utf8 vendor/keys.json
            Write-Host "chave do YouTube incluída no app"
          } else { Write-Host "sem segredo YT_API_KEY: cada anfitrião coloca a chave nas Configurações" }

      - name: Compilar o app
        if: steps.check.outputs.skip == 'false'
        run: node build.js

      - name: Zipar
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: Compress-Archive -Path "dist/Tatao-win32-x64" -DestinationPath "Tatao-Windows.zip" -Force

      - name: Publicar Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.ver }}
          name: Tátão v${{ steps.check.outputs.ver }}
          files: Tatao-Windows.zip
          body: |
            Atualização do Tátão.
            Baixe o Tatao-Windows.zip, extraia e abra o Tatao.exe (fora de C:\Program Files).
