  try{var q=new URLSearchParams(location.search),r=document.documentElement.style;["bg","track","bar"].forEach(function(k){var v=q.get(k);if(/^#[0-9a-f]{6}$/i.test(v||""))r.setProperty("--"+k,v);});}catch(_){}
  // progresso real (o principal avisa cada etapa)
  window.setP=function(p){p=Math.max(0,Math.min(1,+p||0));document.getElementById("fill").style.width=Math.max(6,Math.round(p*100))+"%";document.getElementById("pb").setAttribute("aria-valuenow",String(Math.round(p*100)));};
</script>
</body>
</html>
